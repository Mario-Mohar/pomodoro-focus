name: Bug report
description: Something behaves differently than it should
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options: ["Timer", "Task list", "Statistics or heatmap", "Streak", "Export or import", "Notifications or sound", "Somewhere else"]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: Roughly what local time did it happen at
      description: "Worth asking: several past bugs only showed up between midnight and 02:00, where the local and UTC dates disagree."
